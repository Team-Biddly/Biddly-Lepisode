@if (admin(); as admin) {
    <div class="flex flex-col gap-6">
        <div class="flex items-center gap-2">
            <div class="flex items-center cursor-pointer" routerLink="/admin/super">
                <div class="w-5 h-5">
                    <app-button icon="mdi:chevron-left" />
                </div>
                <p class="text-xl font-semibold">목록으로</p>
            </div>
        </div>

        <section>
            <div class="flex flex-col gap-6 border border-gray-200 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <button class="flex items-center gap-3 cursor-pointer" (click)="isOpen = !isOpen">
                        <div class="text-xl font-semibold">기본 정보</div>
                        <button class="w-5 h-5 transition duration-300 ease-in-out">
                            <app-button [icon]="isOpen ? 'mdi:chevron-up' : 'mdi:chevron-down'" />
                        </button>
                    </button>
                    <div buttons>
                        <button class="cursor-pointer" [cdkMenuTriggerFor]="menu">
                            <app-button icon="mdi:dots-vertical" />
                        </button>
                    </div>

                    <ng-template #menu>
                        <app-menu cdkMenu>
                            <app-menu-option (click)="toggleBlock()">차단/차단해제</app-menu-option>
                        </app-menu>
                    </ng-template>
                </div>

                @if (isOpen) {
                    <hr class="border-gray-200" />
                }

                @if (isOpen) {
                    <div class="grid grid-cols-3 gap-4">
                        <div class="flex flex-col gap-1">
                            <span class="font-semibold text-gray-700">관리자명</span>
                            <span class="text-gray-500">{{ admin.name }}</span>
                        </div>

                        <div class="flex flex-col gap-1">
                            <span class="font-semibold text-gray-700">이메일</span>
                            <span class="text-gray-500">{{ admin.email }}</span>
                        </div>

                        <div class="flex flex-col gap-1">
                            <span class="font-semibold text-gray-700">등록일시</span>
                            <span class="text-gray-500">{{ admin.createdAt | date: 'yyyy-MM-dd HH:mm' }}</span>
                        </div>
                    </div>
                }
            </div>
        </section>

        <app-admin-log [admin]="admin" />
    </div>
}
