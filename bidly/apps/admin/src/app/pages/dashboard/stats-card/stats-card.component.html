<div
    [ngClass]="{ 'transition-colors hover:bg-primary-50': active() }"
    class="flex items-center justify-between w-full gap-3 p-6 border border-gray-100 rounded-xl"
>
    <div class="flex flex-col gap-3">
        @if (label(); as label) {
            <p class="text-gray-800">
                {{ label }}
            </p>
        }
        <p class="text-[32px] font-bold text-gray-800">
            @if (type() === 'text') {
                {{ value() }}
            } @else {
                {{ value() | number }}
            }
            <span class="text-sm text-gray-500">{{ unit() }}</span>
        </p>
    </div>
    <div class="min-w-[5rem] min-h-[5rem] bg-primary-content flex justify-center items-center rounded-xl">
        <app-icon [name]="icon()" class="!size-10 text-primary" />
    </div>
</div>
