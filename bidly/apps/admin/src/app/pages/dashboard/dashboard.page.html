<main id="dashboard" class="p-8 bg-gray-100">
    <section class="card-section border border-gray-200">
        <p class="text-gray-800 font-bold text-2xl">운영 정보</p>
        <p>가입자</p>

        <app-signup-user-chart />

        <p class="text-gray-700 font-semibold text-xl">불러온 조달 정보</p>
        <div class="grid grid-cols-3 gap-6">
            <app-stats-card label="발주 계획" type="number" [value]="1300" unit="건" icon="material-symbols:book-2" />
            <app-stats-card label="사전 규격" type="number" [value]="4225" unit="건" icon="material-symbols:file-open-sharp" />
            <app-stats-card label="입찰 공고" type="number" [value]="520" unit="건" icon="material-symbols:lab-profile-outline-rounded" />
        </div>
    </section>
</main>
