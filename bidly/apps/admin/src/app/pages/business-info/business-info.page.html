<form [formGroup]="form" (ngSubmit)="submit($event)" class="flex flex-col gap-4">
    <div class="gap-2 flex flex-col">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">로고</span>
            <span class="text-primary">*</span>
        </div>
        <app-file-uploader
            label="이미지"
            formControlName="logo"
            accept="image/*"
            placeholder=".png, .jpeg, .jpg, .svg 등 이미지 형식만 가능합니다."
            [maxLength]="1"
            [useConvertToWebp]="true"
            [uploadHandler]="uploadHandler"
            [deleteHandler]="deleteHandler"
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">상호</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="businessName"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="상호를 입력해주세요."
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">대표자명</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="representativeName"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="대표자 이름을 입력해주세요."
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">사업자등록번호</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="businessRegistrationNumber"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="사업자등록번호를 입력해주세요."
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">고객문의</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="email"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="연락 가능한 이메일 주소를 기재해 주세요."
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">고객센터</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="customerServiceCenter"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="고객 센터 번호와 운영 시간을 기재해 주세요."
        />
    </div>

    <div class="flex flex-col gap-2 w-full">
        <div class="flex items-center gap-1">
            <span class="font-semibold text-zinc-800">주소</span>
            <span class="text-primary">*</span>
        </div>
        <input
            formControlName="address"
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="text"
            placeholder="사업자등록증과 일치하는 주소 혹은 소비자 불만사항을 처리할 수 있는 곳의 주소를 기재해 주세요."
        />
    </div>

    <div class="flex justify-end gap-2">
        <button type="button" (click)="form.reset()" class="border border-primary rounded-md text-primary p-2 cursor-pointer">
            초기화
        </button>
        <button type="submit" class="bg-primary text-white rounded-md px-3 py-2 cursor-pointer">저장</button>
    </div>
</form>
