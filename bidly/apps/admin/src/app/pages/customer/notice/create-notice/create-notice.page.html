<main>
    @let label = id() ? '공지사항 수정' : '공지사항 등록';

    <form (ngSubmit)="submit()" [formGroup]="form" class="flex flex-col gap-6">
        <app-accordion [title]="label">
            <section class="flex flex-col gap-6">
                <div class="flex items-center gap-3">
                    <app-checkbox label="고정여부" formControlName="isPinned" />
                    <p
                        class="text-sm"
                        [ngClass]="{
                            'text-primary': form.controls.isPinned.value,
                            'text-gray-400': !form.controls.isPinned.value,
                        }"
                    ></p>
                </div>
                <app-fieldset label="제목" required>
                    <input
                        formControlName="title"
                        class="input w-full text-zinc-800 placeholder:text-zinc-400"
                        placeholder="제목을 입력해주세요."
                    />
                </app-fieldset>

                <app-fieldset label="내용" required>
                    <textarea
                        formControlName="content"
                        class="textarea w-full text-zinc-800 placeholder:text-zinc-400"
                        placeholder="내용을 입력해주세요."
                    ></textarea>
                </app-fieldset>
            </section>
        </app-accordion>
        <div class="flex items-center justify-between">
            <button routerLink=".." class="btn btn-primary">목록</button>
            <button type="submit" class="btn btn-primary">
                {{ id() ? '수정' : '등록' }}
            </button>
        </div>
    </form>
</main>
