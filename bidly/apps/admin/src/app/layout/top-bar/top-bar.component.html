<section id="top-bar" class="border-b border-gray-200 z-50 flex justify-between w-full p-5 transition-all">
    <div class="flex flex-col gap-1">
        <div class="text-2xl font-semibold">
            {{ header() }}
        </div>
        @if (description()) {
            <div class="flex text-sm description">
                {{ description() }}
            </div>
        }
    </div>
    <ng-container *ngTemplateOutlet="suffixSection" />
</section>

<ng-template #suffixSection>
    @if (admin() !== null || admin() !== undefined; as admin) {
        <div #menu class="relative flex items-center">
            <button class="cursor-pointer" (click)="toggleMenu()">
                <app-icon name="mdi:account" />
            </button>

            @if (isMenuOpen()) {
                <button class="absolute right-6 top-10 w-40 bg-white border border-gray-200 rounded-lg shadow-lg flex flex-col py-2 z-50">
                    <button
                        class="cursor-pointer px-4 py-2 text-left text-gray-700 hover:text-blue-500 hover:bg-blue-50"
                        (click)="logout()"
                    >
                        로그아웃
                    </button>
                    <button
                        class="cursor-pointer px-4 py-2 text-left text-gray-700 hover:bg-blue-50 hover:text-blue-500"
                        (click)="openUpdateMyInfoModal()"
                    >
                        내 정보 수정
                    </button>
                </button>
            }
        </div>
    }
</ng-template>

@if (showUpdateMyInfoModal()) {
    <app-update-my-info (closeClick)="closeUpdateMyInfoModal()" />
}
