@if (item(); as item) {
    <div [routerLink]="" class="flex w-full h-32 sm:h-[200px] border border-zinc-200 p-6 min-w-max">
        <div class="flex flex-col justify-between w-full">
            <div class="flex w-full">
                <div class="flex flex-col gap-3 flex-1">
                    <span class="text-xs font-semibold">
                        <span
                            class="rounded-sm px-1.5 py-0.5"
                            [ngClass]="{
                                'bg-[#F65F2C]/10 text-[#F65F2C]': item.type === '기술용역',
                                'bg-[#2EB491]/10 text-[#2EB491]': item.type === '공사',
                                'bg-[#F2921D]/10 text-[#F2921D]': item.type === '일반입찰',
                                'bg-[#F24E1E]/10 text-[#F24E1E]': item.type === '긴급 입찰',
                                'bg-[#4A73DB]/10 text-[#4A73DB]': item.type === '민간 공사',
                                'bg-zinc-200 text-zinc-600': item.type === '기타',
                            }"
                        >
                            {{ item.type }}
                        </span>
                    </span>
                    <p class="font-semibold text-zinc-800">{{ item.title }}</p>
                    <div class="text-zinc-600 text-sm">{{ item.detail }}</div>
                </div>

                <button (click)="isBookMarked.set(!isBookMarked())" class="flex items-start">
                    @if (isBookMarked()) {
                        <app-icon name="mdi:bookmark" class="size-5 text-primary" />
                    } @else {
                        <app-icon name="mdi:bookmark-outline" class="size-5 text-zinc-300" />
                    }
                </button>
            </div>

            <div class="sm:flex items-end hidden">
                <app-icon name="mdi:office-building" class="w-4 h-4 text-zinc-400" />
                <p class="text-sm text-zinc-400">
                    수요기관 <span class="text-sm text-zinc-600">{{ item.agency }}</span>
                </p>
            </div>
        </div>
    </div>
}
