<main class="flex flex-col items-center justify-center min-h-screen w-full max-w-sm mx-auto px-4 py-6 sm:px-0 sm:py-[15rem]">
    <form [formGroup]="form" (submit)="onSubmit()" class="flex flex-col items-center gap-6 w-full">
        <div class="flex flex-col items-center gap-1.5">
            <p class="text-zinc-800 text-2xl font-bold">비밀번호 재설정</p>
            <p class="text-zinc-500">비밀번호를 재설정해주세요.</p>
        </div>

        <div class="flex flex-col gap-2 w-full">
            <div class="flex items-center gap-1">
                <span class="font-semibold text-zinc-800">새 비밀번호</span>
                <span class="w-2 h-2 rounded-full bg-primary"></span>
            </div>
            <input
                formControlName="password"
                class="w-full input text-zinc-800 placeholder:text-zinc-400"
                type="password"
                placeholder="비밀번호를 입력해 주세요."
            />
        </div>

        <div class="flex flex-col gap-2 w-full">
            <div class="flex items-center gap-1">
                <span class="font-semibold text-zinc-800">새 비밀번호 확인</span>
                <span class="w-2 h-2 rounded-full bg-primary"></span>
            </div>
            <input
                formControlName="confirmedPassword"
                class="w-full input text-zinc-800 placeholder:text-zinc-400"
                type="password"
                placeholder="비밀번호를 입력해 주세요."
            />
        </div>

        <div class="flex gap-3 w-full">
            <button type="button" class="py-2 border border-zinc-200 rounded-sm w-full" routerLink="/user/find-password">이전</button>
            <button
                type="submit"
                [disabled]="invalid()"
                class="py-2 text-white bg-primary rounded-sm w-full"
                [class.cursor-not-allowed]="invalid()"
                [class.pointer-events-none]="invalid()"
                [class.text-zinc-400]="invalid()"
                [class.bg-zinc-200]="invalid()"
            >
                확인
            </button>
        </div>
    </form>
</main>
