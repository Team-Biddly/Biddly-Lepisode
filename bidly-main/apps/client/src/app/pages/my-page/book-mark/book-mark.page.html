<div class="flex flex-col bg-white w-full gap-6 px-4 lg:px-0 py-5 lg:py-0">
    <p class="hidden lg:block text-2xl font-bold text-zinc-800">북마크</p>

    <div class="w-full border-b border-zinc-100">
        <div class="flex text-zinc-500 gap-3">
            <button
                class="relative px-4 py-2 cursor-pointer"
                [ngClass]="currentTab() === 'order-plan' ? 'text-zinc-800 font-semibold' : 'text-zinc-400'"
                (click)="currentTab.set('order-plan')"
            >
                발주 계획
                @if (currentTab() === 'order-plan') {
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-[2px] bg-primary"></div>
                }
            </button>

            <button
                class="relative px-4 py-2 cursor-pointer"
                [ngClass]="currentTab() === 'pre-spec' ? 'text-zinc-800 font-semibold' : 'text-zinc-400'"
                (click)="currentTab.set('pre-spec')"
            >
                사전 규격
                @if (currentTab() === 'pre-spec') {
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-[2px] bg-primary"></div>
                }
            </button>

            <button
                class="relative px-4 py-2 cursor-pointer"
                [ngClass]="currentTab() === 'bid' ? 'text-zinc-800 font-semibold' : 'text-zinc-400'"
                (click)="currentTab.set('bid')"
            >
                입찰 공고
                @if (currentTab() === 'bid') {
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-[2px] bg-primary"></div>
                }
            </button>
        </div>
    </div>

    @switch (currentTab()) {
        @case ('order-plan') {
            <app-bookmark-order-plan />
        }
        @case ('pre-spec') {
            <app-bookmark-pre-spec />
        }
        @case ('bid') {
            <app-bookmark-bid />
        }
    }
</div>
