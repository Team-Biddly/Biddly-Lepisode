<main class="flex flex-col items-center justify-center min-h-screen gap-6 px-4 py-6 sm:px-0 sm:py-[15rem] w-full max-w-sm mx-auto">
    <div class="flex flex-col items-center gap-3">
        <img [src]="$data.value()?.logo?.url" alt="logo" class="w-44 h-16" />
        <p class="text-center text-zinc-500">비들리와 함께 스마트한 입찰을 시작해보세요</p>
    </div>

    <img src="icons/search_hand.svg" alt="search_hand" class="w-24 h-24" />

    <form [formGroup]="form" class="flex flex-col gap-2 w-full">
        <input
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="email"
            appInput
            formControlName="email"
            placeholder="이메일주소"
        />
        <input
            class="w-full input text-zinc-800 placeholder:text-zinc-400"
            type="password"
            appInput
            formControlName="password"
            placeholder="비밀번호"
        />

        <div class="flex items-center justify-between text-sm py-3">
            <label class="flex items-center gap-1">
                <input type="checkbox" checked class="checkbox" />
                <span>자동 로그인</span>
            </label>
            <div class="flex items-center gap-2 text-zinc-800 font-medium">
                <a routerLink="/user/find-email">이메일 찾기</a>
                <span class="text-zinc-300">|</span>
                <a routerLink="/user/find-password">비밀번호 찾기</a>
            </div>
        </div>
    </form>

    <div class="flex flex-col gap-3 w-full">
        <button type="button" class="bg-primary text-white rounded-sm py-2" (click)="emailLogin($event)">로그인</button>
        <button type="button" class="border border-zinc-200 rounded-sm py-2" routerLink="/user/sign-up">회원가입</button>
    </div>

    <div class="flex items-center gap-2 w-full">
        <hr class="flex-grow border-zinc-200" />
        <span class="text-zinc-500 text-sm">SNS 계정으로 로그인</span>
        <hr class="flex-grow border-zinc-200" />
    </div>

    <div class="flex gap-4">
        <button (click)="kakaoLogin($event)">
            <img src="icons/kakao.svg" alt="kakao" class="w-10 h-10" />
        </button>
        <button (click)="googleLogin($event)">
            <img src="icons/google.svg" alt="google" class="w-10 h-10" />
        </button>
    </div>
</main>
