<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black">
    <div class="bg-white rounded-2xl shadow-lg w-[520px] p-8 flex flex-col gap-6">
        <div class="flex items-center justify-between">
            <p class="text-2xl font-bold text-gray-800">내 정보 수정</p>
            <button class="text-2xl text-gray-700 cursor-pointer" type="button" (click)="closeModal()">×</button>
        </div>

        <form [formGroup]="form" (submit)="onSubmit($event)" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label for="email" class="text-sm font-medium text-gray-700"> 이메일 <span class="text-primary">*</span> </label>
                <input
                    id="email"
                    type="email"
                    formControlName="email"
                    placeholder="이메일 주소를 입력해 주세요."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder:text-gray-400"
                />
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-700"> 비밀번호 <span class="text-primary">*</span> </label>
                <input
                    id="password"
                    type="password"
                    formControlName="password"
                    placeholder="비밀번호를 입력해 주세요."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder:text-gray-400"
                />
                <input
                    id="passwordConfirm"
                    type="password"
                    formControlName="passwordConfirm"
                    placeholder="비밀번호를 다시 입력해 주세요."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder:text-gray-400"
                />
            </div>

            <div class="flex flex-col gap-2">
                <label for="name" class="text-sm font-medium text-gray-700"> 관리자명 <span class="text-primary">*</span> </label>
                <input
                    id="name"
                    type="text"
                    formControlName="name"
                    placeholder="관리자명을 입력해 주세요."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder:text-gray-400"
                />
            </div>

            <button type="submit" [disabled]="form.invalid" class="w-full py-3 rounded-xl bg-primary text-white font-semibold text-lg">
                등록
            </button>
        </form>
    </div>
</div>
