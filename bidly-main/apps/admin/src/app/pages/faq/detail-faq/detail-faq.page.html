@if (faq(); as faq) {
    <div class="flex items-center gap-2">
        <div class="flex items-center cursor-pointer" routerLink="/faq">
            <app-icon name="mdi:chevron-left" />
            <p class="text-xl font-semibold">목록으로</p>
        </div>
    </div>

    <section class="mt-6">
        <div class="flex flex-col gap-6 border border-gray-200 rounded-lg p-6">
            <div class="flex items-center justify-between">
                <button class="flex items-center gap-3 cursor-pointer" (click)="isInfoOpen = !isInfoOpen">
                    <div class="text-base font-semibold">기본 정보</div>
                    <app-icon
                        [name]="isInfoOpen ? 'mdi:chevron-up' : 'mdi:chevron-down'"
                        class="w-5 h-5 transition duration-300 ease-in-out"
                    />
                </button>

                <div buttons>
                    <button class="cursor-pointer" [cdkMenuTriggerFor]="menu">
                        <app-icon name="mdi:dots-vertical" />
                    </button>
                </div>

                <ng-template #menu>
                    <app-menu cdkMenu>
                        <app-menu-option [routerLink]="['/faq/update', id()]">수정</app-menu-option>
                        <app-menu-option (click)="handleDelete(faq)" variant="ghost" color="error">삭제</app-menu-option>
                    </app-menu>
                </ng-template>
            </div>

            @if (isInfoOpen) {
                <hr class="border-gray-200" />
            }

            @if (isInfoOpen) {
                <div class="grid grid-cols-3 gap-4">
                    <div class="flex flex-col gap-1">
                        <span class="font-semibold text-gray-700">고정여부</span>
                        <span class="text-gray-500">{{ faq.isPinned ? '고정' : '미고정' }}</span>
                    </div>

                    <div class="flex flex-col gap-1">
                        <span class="font-semibold text-gray-700">작성자</span>
                        <span class="text-gray-500">{{ faq.admin?.name || '관리자명' }}</span>
                    </div>

                    <div class="flex flex-col gap-1">
                        <span class="font-semibold text-gray-700">등록일시</span>
                        <span class="text-gray-500">{{ faq.createdAt | date: 'yyyy-MM-dd HH:mm' }}</span>
                    </div>
                </div>
            }
        </div>
    </section>

    <section class="mt-6">
        <div class="flex flex-col gap-6 border border-gray-200 rounded-lg p-6">
            <div class="flex items-center justify-between">
                <button class="flex items-center gap-3 cursor-pointer" (click)="isContentOpen = !isContentOpen">
                    <div class="text-gray-800 font-semibold text-xl text-left">{{ faq.title }}</div>
                    <app-icon
                        [name]="isContentOpen ? 'mdi:chevron-up' : 'mdi:chevron-down'"
                        class="w-5 h-5 transition duration-300 ease-in-out"
                    />
                </button>
            </div>

            @if (isContentOpen) {
                <hr class="border-gray-200" />
            }

            @if (isContentOpen) {
                <p class="text-gray-600">{{ faq.content }}</p>
            }
        </div>
    </section>
}
