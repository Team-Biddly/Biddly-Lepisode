<main>
    <div class="flex flex-col items-center gap-6 py-[15rem] w-full max-w-sm mx-auto">
        <img src="icons/admin.svg" alt="admin" class="w-24 h-24" />
        <span class="text-gray-700 font-bold text-3xl">로그인</span>

        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2 w-full">
            <span>이메일</span>
            <input
                class="w-full input border rounded-md text-zinc-800 placeholder:text-zinc-400"
                type="email"
                appInput
                formControlName="email"
                placeholder="이메일을 입력하세요."
            />

            <span>비밀번호</span>
            <input
                class="w-full input border rounded-md text-zinc-800 placeholder:text-zinc-400"
                type="password"
                appInput
                formControlName="password"
                placeholder="비밀번호를 입력하세요."
            />

            <app-checkbox label="로그인 상태 유지" class="text-sm py-3" />

            <div class="flex flex-col w-full">
                <button type="submit" class="bg-primary text-white rounded-md py-2 cursor-pointer">로그인</button>
            </div>
        </form>
    </div>
</main>
